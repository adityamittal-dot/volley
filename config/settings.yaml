# How volley runs. Anything here can be overridden with an env var of the same
# name in caps prefixed VOLLEY_ (e.g. VOLLEY_MODE=send).

# draft = emails land in your Gmail Drafts, you hit send.
# send  = volley sends them itself.
mode: draft

daily_new: 25          # new first-touch emails per day (raise to 30 once Gmail deliverability holds up)
send_days: [0, 1, 2, 3, 4]   # Mon-Fri (0 = Monday)
followup_days: [4, 10] # follow-up #1 and #2, days after the first email
min_fit: 6             # analyst fit score (1-10) below this is skipped
research_factor: 2.0   # analyze this many leads per open slot (about half drop as irrelevant / low fit)
lead_max_age_days: 30  # ignore postings older than this
allow_guessed_emails: true   # founder@ pattern guesses (MX-checked) when nothing better exists

# Send windows (UTC hour -> recipient regions). Emails wait in the queue until
# their region's window so they land around 9-11am local time.
windows:
  3: [india, asia, other]
  8: [europe, africa, middle_east]
  14: [us, americas]

# Who does the thinking.
#   routine = a daily Claude Code routine (claude.ai/code/routines) follows OUTREACH.md,
#             paid from Claude credits. GitHub Actions does everything else for free.
#   api     = GitHub Actions calls the Claude API directly (needs ANTHROPIC_API_KEY).
engine: routine
credits_until: "2026-11-10"   # last day the routine is expected to run

# API-engine model routing: cheap model for reading/extracting/fixing, strong model for
# the one thing people actually read.
models:
  analyst: claude-haiku-4-5     # read site + posting, pick contact, score fit, find the hook
  writer: claude-sonnet-5       # write the first email
  fixer: claude-haiku-4-5       # humanizer fix-up when the linter flags a draft

daily_budget_usd: 0.60   # hard stop for API spend per day

# Delhi NCR leads (startups included, even ones with no listed opening) get pushed to the front of
# the pool. Pay is INR; stipend is per month, lpa figures are per year.
priority:
  cities: [gurgaon, gurugram, noida, greater noida, delhi, new delhi]
  min_lpa: 8
  target_lpa: 10
  min_stipend: 25000
  target_stipend: 40000

sources:
  hn_hiring: true
  yc_hiring: true
  remoteok: true
  remotive: true
  arbeitnow: true
  jobicy: true
  himalayas: true
  unstop: true         # India internships / jobs (public API)
  internshala: true    # India internships / fresher jobs, filtered to NCR + pay floor
  github_orgs: true    # niche NCR startups with no posted opening, found by GitHub org location
  funding_news: true   # recently-funded Indian startups (Entrackr, Inc42, ET, YourStory); NCR ones get priority
  simplify: true
