name: volley

on:
  schedule:
    # Mon-Fri, once per send window (UTC): India/Asia, Europe, US.
    - cron: "0 3 * * 1-5"
    - cron: "0 8 * * 1-5"
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Write emails but don't touch Gmail (see data/preview.md in the run artifact)"
        type: boolean
        default: false
      all_regions:
        description: "Ignore send windows and deliver everything queued"
        type: boolean
        default: false

concurrency:
  group: volley
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VOLLEY_MODE: ${{ vars.VOLLEY_MODE }}
          VOLLEY_DAILY_NEW: ${{ vars.VOLLEY_DAILY_NEW }}
        run: |
          args=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
          if [ "${{ inputs.all_regions }}" = "true" ]; then args="$args --all-regions"; fi
          python -m volley run $args

      - name: Upload preview
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: data/preview.md

      - name: Commit tracker
        if: always()
        run: |
          git config user.name "volley"
          git config user.email "volley@users.noreply.github.com"
          git add -A data TRACKER.md 2>/dev/null || git add -A data
          git diff --cached --quiet || git commit -m "tracker: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
